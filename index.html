<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TG Premium Shop</title>
    <!-- Tailwind CSS для крутого дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #f3f4f6);
            color: var(--tg-theme-text-color, #1f2937);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .tg-btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
        }
        /* Плавное появление товаров */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 pb-24 min-h-screen selection:bg-blue-500/30">

    <!-- Хедер приложения -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-extrabold tracking-tight">Каталог вещей</h1>
            <p class="text-xs opacity-60 mt-0.5">Premium Облачный Магазин</p>
        </div>
        <button onclick="toggleCartModal()" class="relative p-2.5 rounded-full card shadow-sm border border-gray-200/10 hover:scale-105 active:scale-95 transition-all">
            🛍️
            <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
        </button>
    </div>

    <!-- Фильтры категорий -->
    <div id="categories-container" class="flex gap-2 overflow-x-auto pb-3 mb-2 scrollbar-none snap-x">
        <button onclick="filterCategory('all')" id="cat-all" class="cat-btn snap-start px-4 py-1.5 rounded-full text-sm font-medium transition-all tg-btn shadow-sm">Все</button>
    </div>

    <!-- Фильтры брендов -->
    <div id="brands-container" class="flex gap-1.5 overflow-x-auto pb-4 mb-4 scrollbar-none border-b border-gray-200/10"></div>

    <!-- Лоадер при загрузке -->
    <div id="loader" class="flex flex-col items-center justify-center py-20 gap-3">
        <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm opacity-60">Загрузка товаров из Google Cloud...</p>
    </div>

    <!-- Сетка товаров -->
    <div id="products-grid" class="grid grid-cols-2 gap-3.5 hidden"></div>

    <!-- Модальное окно Корзины -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300" onclick="toggleCartModal()">
        <div class="card w-full max-w-md rounded-t-2xl p-5 max-h-[85vh] overflow-y-auto transform translate-y-full transition-transform duration-300" onclick="event.stopPropagation()">
            <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full mx-auto mb-4"></div>
            <h2 class="text-xl font-bold mb-4 flex items-center justify-between">
                <span>Ваша корзина</span>
                <button onclick="toggleCartModal()" class="text-sm font-normal opacity-60">Закрыть</button>
            </h2>
            <div id="cart-items" class="space-y-4 mb-6"></div>
            <div class="flex justify-between items-center font-bold text-lg mb-6 border-t border-gray-200/10 pt-4">
                <span>Итого:</span>
                <span id="cart-total-price">0 ₽</span>
            </div>
            <button onclick="checkout()" class="w-full tg-btn py-3.5 rounded-xl font-bold text-center active:scale-[0.99] transition-all shadow-md">Оформить заказ</button>
        </div>
    </div>

    <script>
        // ВСТАВЬ СЮДА СВОЙ ID ТАБЛИЦЫ
        const SPREADSHEET_ID = '1VrL1prK3HMxk_OjEbqJeglLfOGGGuJqTt_FoLU1qOTM';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

        let products = [];
        let cart = [];
        let currentCategory = 'all';
        let currentBrand = 'all';

        let tg = window.Telegram?.WebApp;
        if(tg) {
            tg.expand();
            tg.ready();
        }

        // Загрузка данных из Google Таблицы
        async function loadProducts() {
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                // Очистка JSON от лишнего префикса Google
                const data = JSON.parse(text.substr(47).slice(0, -2));
                
                const rows = data.table.rows;
                const headers = data.table.cols.map(col => col.label ? col.label.toLowerCase() : '');

                products = rows.map((row, index) => {
                    let p = { id: index + 1 };
                    row.c.forEach((cell, i) => {
                        if(headers[i]) p[headers[i]] = cell ? cell.v : '';
                    });
                    return p;
                }).filter(p => p.title); // убираем пустые

                document.getElementById('loader').classList.add('hidden');
                document.getElementById('products-grid').classList.remove('hidden');
                
                renderFilters();
                renderProducts();
            } catch (error) {
                console.error("Ошибка загрузки данных:", error);
                document.getElementById('loader').innerHTML = '<p class="text-red-500 font-medium text-center p-4">Ошибка загрузки каталога. Проверьте доступ к таблице.</p>';
            }
        }

        // Генерация кнопок фильтров
        function renderFilters() {
            const categories = ['all', ...new Set(products.map(p => p.category))];
            const catsContainer = document.getElementById('categories-container');
            catsContainer.innerHTML = '';
            
            categories.forEach(cat => {
                if(!cat) return;
                const isSelected = cat === currentCategory;
                const btn = document.createElement('button');
                btn.className = `snap-start px-4 py-1.5 rounded-full text-sm font-medium transition-all ${isSelected ? 'tg-btn shadow-sm' : 'card border border-gray-200/10 opacity-70'}`;
                btn.textContent = cat === 'all' ? 'Все' : cat;
                btn.onclick = () => filterCategory(cat);
                catsContainer.appendChild(btn);
            });

            // Бренды
            const filteredByCat = currentCategory === 'all' ? products : products.filter(p => p.category === currentCategory);
            const brands = ['all', ...new Set(filteredByCat.map(p => p.brand))];
            const brandsContainer = document.getElementById('brands-container');
            brandsContainer.innerHTML = '';

            if (brands.length > 1) {
                brands.forEach(brand => {
                    if(!brand) return;
                    const isSelected = brand === currentBrand;
                    const btn = document.createElement('button');
                    btn.className = `px-3 py-1 rounded-lg text-xs font-semibold transition-all ${isSelected ? 'bg-blue-500/20 text-blue-500 border border-blue-500/30' : 'opacity-50'}`;
                    btn.textContent = brand === 'all' ? 'Все бренды' : brand;
                    btn.onclick = () => filterBrand(brand);
                    brandsContainer.appendChild(btn);
                });
            }
        }

        function filterCategory(cat) { currentCategory = cat; currentBrand = 'all'; renderFilters(); renderProducts(); }
        function filterBrand(brand) { currentBrand = brand; renderFilters(); renderProducts(); }

        // Отрисовка карточек товаров
        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            const filtered = products.filter(p => {
                const matchCat = currentCategory === 'all' || p.category === currentCategory;
                const matchBrand = currentBrand === 'all' || p.brand === currentBrand;
                return matchCat && matchBrand;
            });

            if(filtered.length === 0) {
                grid.innerHTML = '<p class="col-span-2 text-center py-10 opacity-50 text-sm">Нет товаров в данной категории</p>';
                return;
            }

            filtered.forEach(p => {
                const sizesArray = p.sizes ? p.sizes.toString().split(',') : [];
                let sizesHtml = sizesArray.map(s => `<span class="text-[10px] px-1.5 py-0.5 rounded bg-gray-500/10 font-mono">${s.trim()}</span>`).join(' ');

                const card = document.createElement('div');
                card.className = 'card rounded-xl overflow-hidden shadow-sm flex flex-col justify-between border border-gray-200/5 fade-in';
                card.innerHTML = `
                    <div>
                        <div class="relative aspect-square w-full bg-gray-500/5 overflow-hidden">
                            <img src="${p.image || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400'}" alt="${p.title}" class="w-full h-full object-cover">
                            <span class="absolute top-2 left-2 text-[10px] tracking-wider uppercase font-bold px-2 py-0.5 bg-black/60 text-white rounded-md backdrop-blur-md">${p.brand || 'Brand'}</span>
                        </div>
                        <div class="p-3">
                            <h3 class="font-bold text-sm leading-tight line-clamp-2 h-10 mb-1">${p.title}</h3>
                            <div class="flex flex-wrap gap-1 mb-2 min-h-[20px]">${sizesHtml}</div>
                        </div>
                    </div>
                    <div class="p-3 pt-0 flex items-center justify-between gap-2">
                        <span class="font-extrabold text-base whitespace-nowrap">${Number(p.price).toLocaleString('ru-RU')} ₽</span>
                        <button onclick="addToCart(${p.id})" class="tg-btn text-xs font-bold px-3 py-2 rounded-lg active:scale-90 transition-transform flex items-center justify-center">＋ В корзину</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Логика корзины
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const inCart = cart.find(item => item.id === id);

            if (inCart) {
                inCart.quantity++;
            } else {
                // Если размеров несколько, по дефолту берем первый
                const firstSize = product.sizes ? product.sizes.toString().split(',')[0].trim() : 'Универсальный';
                cart.push({ ...product, quantity: 1, selectedSize: firstSize });
            }
            updateCartUI();
            
            // Легкая вибрация телефона при добавлении в ТГ
            if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.getElementById('cart-count');
            
            if(count > 0) {
                badge.textContent = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            // Отрисовка элементов внутри корзины
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += Number(item.price) * item.quantity;
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between gap-3 bg-gray-500/5 p-2 rounded-xl';
                row.innerHTML = `
                    <img src="${item.image}" class="w-12 h-12 object-cover rounded-lg bg-gray-200">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-xs truncate">${item.title}</h4>
                        <p class="text-[10px] opacity-60">Размер: ${item.selectedSize} • ${Number(item.price).toLocaleString('ru-RU')} ₽</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 rounded-lg bg-gray-500/10 flex items-center justify-center font-bold text-sm">-</button>
                        <span class="text-sm font-bold">${item.quantity}</span>
                        <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 rounded-lg bg-gray-500/10 flex items-center justify-center font-bold text-sm">+</button>
                    </div>
                `;
                container.appendChild(row);
            });

            if(cart.length === 0) {
                container.innerHTML = '<p class="text-center py-6 opacity-40 text-sm">Корзина пока пуста</p>';
            }

            document.getElementById('cart-total-price').textContent = total.toLocaleString('ru-RU') + ' ₽';
        }

        function changeQty(id, change) {
            const item = cart.find(i => i.id === id);
            if(!item) return;
            item.quantity += change;
            if(item.quantity <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
        }

        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            const body = modal.querySelector('div');
            if(modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    body.classList.remove('translate-y-full');
                }, 50);
            } else {
                modal.classList.add('opacity-0');
                body.classList.add('translate-y-full');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        // Отправка заказа в ТГ
        function checkout() {
            if(cart.length === 0) {
                alert('Добавьте товары в корзину');
                return;
            }

            let message = "🚀 **Новый заказ из Web App!**\n\n";
            let total = 0;

            cart.forEach((item, index) => {
                const sum = Number(item.price) * item.quantity;
                total += sum;
                message += `${index + 1}. **${item.title}**\n`;
                message += `   👟 Бренд: ${item.brand} | 📐 Размер: ${item.selectedSize}\n`;
                message += `   🔢 Кол-во: ${item.quantity} шт. | 💰 Цена: ${sum.toLocaleString('ru-RU')} ₽\n\n`;
            });

            message += `🏆 **ИТОГО К ОПЛАТЕ: ${total.toLocaleString('ru-RU')} ₽**`;

            if(tg) {
                // ТГ автоматически закроет окно и пришлет это сообщение боту
                tg.sendData(message);
            } else {
                alert('Оформление работает внутри Telegram бота.\n\nДанные заказа:\n' + message);
            }
        }

        // Старт программы
        loadProducts();
    </script>
</body>
</html>
