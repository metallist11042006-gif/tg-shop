<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>DRIP STORE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --tg-bg: var(--tg-theme-bg-color, #0f0f0f);
    --tg-text: var(--tg-theme-text-color, #ffffff);
    --tg-hint: var(--tg-theme-hint-color, #999999);
    --tg-link: var(--tg-theme-link-color, #e0ff00);
    --tg-btn: var(--tg-theme-button-color, #e0ff00);
    --tg-btn-text: var(--tg-theme-button-text-color, #0f0f0f);
    --tg-secondary: var(--tg-theme-secondary-bg-color, #1a1a1a);
    --accent: #e0ff00;
    --accent-dim: rgba(224,255,0,0.12);
    --card-bg: var(--tg-secondary);
    --border: rgba(255,255,255,0.07);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--tg-bg);
    color: var(--tg-text);
    font-family: 'DM Sans', sans-serif;
    margin: 0; padding: 0;
    overflow-x: hidden;
    min-height: 100vh;
  }

  h1, h2, .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; }

  /* ─── SCREENS ──────────────────────────────── */
  .screen {
    position: fixed; inset: 0;
    overflow-y: auto;
    opacity: 0; pointer-events: none;
    transform: translateY(24px);
    transition: opacity .32s cubic-bezier(.4,0,.2,1), transform .32s cubic-bezier(.4,0,.2,1);
    background: var(--tg-bg);
    z-index: 10;
  }
  .screen.active {
    opacity: 1; pointer-events: all;
    transform: translateY(0);
  }
  .screen.exit-left {
    opacity: 0; transform: translateX(-40px);
  }

  /* ─── TOPBAR ────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 99;
    background: var(--tg-bg);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    padding: 10px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .topbar-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; flex: 1; }
  .back-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--tg-secondary);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: background .18s;
  }
  .back-btn:active { background: var(--accent-dim); }
  .back-btn svg { stroke: var(--tg-text); }

  /* ─── CURRENCY SWITCHER ─────────────────────── */
  .currency-switcher {
    display: flex; gap: 4px;
    background: var(--tg-secondary);
    border-radius: 20px; padding: 3px;
    border: 1px solid var(--border);
  }
  .cur-btn {
    padding: 3px 10px; border-radius: 16px; font-size: .78rem; font-weight: 600;
    cursor: pointer; transition: all .2s; color: var(--tg-hint);
  }
  .cur-btn.active {
    background: var(--accent); color: #0f0f0f;
  }

  /* ─── CART BADGE ────────────────────────────── */
  .cart-btn {
    position: relative; cursor: pointer;
    width: 36px; height: 36px;
    background: var(--tg-secondary);
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .18s;
  }
  .cart-btn:active { background: var(--accent-dim); }
  .cart-badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--accent); color: #0f0f0f;
    border-radius: 50%; width: 18px; height: 18px;
    font-size: .68rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    display: none;
  }

  /* ─── WELCOME ───────────────────────────────── */
  .hero-banner {
    width: 100%; height: 220px;
    background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0f0f0f 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .hero-banner::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 60% 40%, rgba(224,255,0,0.18) 0%, transparent 65%);
  }
  .hero-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 4.5rem; line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 60px rgba(224,255,0,0.4);
    position: relative; z-index: 1;
  }
  .hero-sub {
    font-size: .85rem; color: var(--tg-hint);
    letter-spacing: .18em; text-transform: uppercase;
    position: relative; z-index: 1; margin-top: 4px;
  }

  .cat-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; padding: 20px 16px;
  }
  .cat-card {
    background: var(--tg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 16px;
    display: flex; flex-direction: column;
    align-items: center; gap: 10px;
    cursor: pointer;
    transition: all .22s cubic-bezier(.4,0,.2,1);
    user-select: none;
    position: relative; overflow: hidden;
  }
  .cat-card::after {
    content: ''; position: absolute; inset: 0;
    background: var(--accent-dim);
    opacity: 0; transition: opacity .2s;
  }
  .cat-card:active::after { opacity: 1; }
  .cat-card:active { transform: scale(0.97); }
  .cat-icon { font-size: 2.4rem; }
  .cat-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.25rem; letter-spacing: .04em;
    color: var(--tg-text);
  }
  .cat-count { font-size: .75rem; color: var(--tg-hint); }

  /* ─── BRANDS ─────────────────────────────────── */
  .brand-list { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .brand-row {
    background: var(--tg-secondary);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer;
    transition: all .2s;
    user-select: none;
  }
  .brand-row:active { transform: scale(0.98); background: var(--accent-dim); }
  .brand-logo {
    width: 44px; height: 44px; border-radius: 10px;
    background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; flex-shrink: 0;
  }
  .brand-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem; letter-spacing: .04em;
    flex: 1;
  }
  .brand-cnt {
    font-size: .75rem; color: var(--tg-hint);
    background: var(--tg-bg);
    border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 20px;
  }
  .brand-arrow { color: var(--tg-hint); }

  /* ─── CATALOG ─────────────────────────────────── */
  .product-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; padding: 16px;
  }
  .product-card {
    background: var(--tg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden; cursor: pointer;
    transition: transform .2s;
    user-select: none;
  }
  .product-card:active { transform: scale(0.97); }
  .product-img {
    width: 100%; aspect-ratio: 1/1;
    object-fit: cover; display: block;
    background: #1a1a1a;
  }
  .product-img-placeholder {
    width: 100%; aspect-ratio: 1/1;
    background: linear-gradient(135deg, #1a1a1a, #222);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem; color: rgba(255,255,255,0.15);
  }
  .product-body { padding: 10px 12px 12px; }
  .product-title { font-size: .85rem; font-weight: 600; line-height: 1.3; }
  .product-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem; color: var(--accent);
    margin-top: 4px;
  }
  .product-desc { font-size: .72rem; color: var(--tg-hint); margin-top: 3px; line-height: 1.4; }

  /* ─── PRODUCT DETAIL ─────────────────────────── */
  #screen-detail .product-detail-img {
    width: 100%; aspect-ratio: 4/3;
    object-fit: cover; display: block;
    background: #1a1a1a;
  }
  .detail-body { padding: 20px 16px; }
  .detail-brand { font-size: .78rem; color: var(--tg-hint); text-transform: uppercase; letter-spacing: .1em; }
  .detail-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; line-height: 1.1; margin-top: 4px; }
  .detail-price { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--accent); margin-top: 6px; }
  .detail-desc { font-size: .85rem; color: var(--tg-hint); line-height: 1.6; margin-top: 12px; }
  .sizes-label { font-size: .78rem; color: var(--tg-hint); text-transform: uppercase; letter-spacing: .1em; margin: 18px 0 8px; }
  .sizes-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .size-btn {
    padding: 7px 14px; border-radius: 10px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--tg-text);
    font-size: .82rem; font-weight: 600;
    cursor: pointer; transition: all .18s;
  }
  .size-btn.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f0f0f;
  }
  .size-btn:active { transform: scale(0.94); }
  .add-cart-btn {
    width: 100%; margin-top: 20px;
    padding: 16px;
    background: var(--accent); color: #0f0f0f;
    border: none; border-radius: 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.25rem; letter-spacing: .06em;
    cursor: pointer;
    transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .add-cart-btn:active { transform: scale(0.98); filter: brightness(0.9); }
  .add-cart-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ─── CART ────────────────────────────────────── */
  .cart-items { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .cart-item {
    background: var(--tg-secondary);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex; gap: 12px; padding: 12px;
  }
  .cart-item-img {
    width: 72px; height: 72px; border-radius: 10px;
    object-fit: cover; background: #1a1a1a; flex-shrink: 0;
  }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-title { font-size: .85rem; font-weight: 600; line-height: 1.3; }
  .cart-item-size { font-size: .75rem; color: var(--tg-hint); margin-top: 2px; }
  .cart-item-price { font-family: 'Bebas Neue', sans-serif; font-size: 1.15rem; color: var(--accent); margin-top: 4px; }
  .qty-controls { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--tg-bg); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1rem; color: var(--tg-text);
    transition: background .18s;
  }
  .qty-btn:active { background: var(--accent-dim); }
  .qty-num { font-size: .9rem; font-weight: 600; min-width: 20px; text-align: center; }
  .delete-btn { color: #ff4444; font-size: 1.2rem; cursor: pointer; padding: 4px; }
  .cart-total-box {
    margin: 0 16px 8px;
    background: var(--tg-secondary);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .cart-total-row { display: flex; justify-content: space-between; align-items: center; }
  .cart-total-label { font-size: .85rem; color: var(--tg-hint); }
  .cart-total-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--accent); }
  .checkout-btn {
    width: calc(100% - 32px); margin: 12px 16px 24px;
    padding: 17px;
    background: var(--accent); color: #0f0f0f;
    border: none; border-radius: 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem; letter-spacing: .06em;
    cursor: pointer;
    transition: all .2s;
  }
  .checkout-btn:active { transform: scale(0.98); filter: brightness(0.9); }
  .empty-cart {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 80px 32px;
    color: var(--tg-hint); text-align: center;
    gap: 12px;
  }
  .empty-icon { font-size: 3.5rem; opacity: .4; }

  /* ─── LOADER ─────────────────────────────────── */
  .loader-wrap {
    display: flex; align-items: center; justify-content: center;
    padding: 60px; flex-direction: column; gap: 12px; color: var(--tg-hint);
  }
  .spinner {
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── TOAST ──────────────────────────────────── */
  #toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--accent); color: #0f0f0f;
    padding: 10px 20px; border-radius: 40px;
    font-weight: 600; font-size: .85rem;
    opacity: 0; transition: all .3s;
    z-index: 999; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ─── SCROLLBAR ──────────────────────────────── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ─── LOADING SCREEN ─────────────────────────── */
  #loading-screen {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--tg-bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    transition: opacity .4s;
  }
  #loading-screen.fade-out { opacity: 0; pointer-events: none; }
  .loading-logo { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; color: var(--accent); }
  .loading-text { font-size: .8rem; color: var(--tg-hint); letter-spacing: .15em; text-transform: uppercase; }
</style>
</head>
<body>

<!-- ════════════ LOADING SCREEN ════════════ -->
<div id="loading-screen">
  <div class="loading-logo">DRIP</div>
  <div class="spinner"></div>
  <div class="loading-text">Загружаем каталог…</div>
</div>

<!-- ════════════ TOAST ════════════ -->
<div id="toast"></div>

<!-- ═══════════════════════════════════════════
     SCREEN 1: WELCOME
═══════════════════════════════════════════ -->
<div id="screen-welcome" class="screen">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-title">DRIP STORE</div>
    <div class="currency-switcher">
      <div class="cur-btn active" data-cur="USD">$</div>
      <div class="cur-btn" data-cur="UAH">₴</div>
      <div class="cur-btn" data-cur="PLN">zł</div>
    </div>
    <div class="cart-btn" onclick="showCart()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <div class="cart-badge" id="cart-badge-welcome">0</div>
    </div>
  </div>

  <!-- Hero -->
  <div class="hero-banner">
    <div class="hero-logo">DRIP</div>
    <div class="hero-sub">Premium Streetwear Store</div>
  </div>

  <!-- Categories -->
  <div style="padding: 20px 16px 8px;">
    <div style="font-family:'Bebas Neue',sans-serif; font-size:1.6rem;">Выбери категорию</div>
    <div style="font-size:.82rem; color:var(--tg-hint); margin-top:2px;">Оригинальная одежда и аксессуары</div>
  </div>
  <div class="cat-grid" id="cat-grid">
    <!-- populated by JS -->
  </div>
</div>

<!-- ═══════════════════════════════════════════
     SCREEN 2: BRANDS
═══════════════════════════════════════════ -->
<div id="screen-brands" class="screen">
  <div class="topbar">
    <div class="back-btn" onclick="goBack('screen-welcome')">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="topbar-title" id="brands-title">Бренды</div>
    <div class="currency-switcher">
      <div class="cur-btn active" data-cur="USD">$</div>
      <div class="cur-btn" data-cur="UAH">₴</div>
      <div class="cur-btn" data-cur="PLN">zł</div>
    </div>
    <div class="cart-btn" onclick="showCart()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <div class="cart-badge" id="cart-badge-brands">0</div>
    </div>
  </div>
  <div class="brand-list" id="brand-list">
    <!-- populated by JS -->
  </div>
</div>

<!-- ═══════════════════════════════════════════
     SCREEN 3: CATALOG
═══════════════════════════════════════════ -->
<div id="screen-catalog" class="screen">
  <div class="topbar">
    <div class="back-btn" onclick="goBack('screen-brands')">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="topbar-title" id="catalog-title">Каталог</div>
    <div class="cart-btn" onclick="showCart()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <div class="cart-badge" id="cart-badge-catalog">0</div>
    </div>
  </div>
  <div class="product-grid" id="product-grid">
    <!-- populated by JS -->
  </div>
</div>

<!-- ═══════════════════════════════════════════
     SCREEN 4: PRODUCT DETAIL
═══════════════════════════════════════════ -->
<div id="screen-detail" class="screen">
  <div class="topbar">
    <div class="back-btn" onclick="goBack('screen-catalog')">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="topbar-title" id="detail-topbar-title">Товар</div>
    <div class="cart-btn" onclick="showCart()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <div class="cart-badge" id="cart-badge-detail">0</div>
    </div>
  </div>
  <div id="detail-content"></div>
</div>

<!-- ═══════════════════════════════════════════
     SCREEN 5: CART
═══════════════════════════════════════════ -->
<div id="screen-cart" class="screen">
  <div class="topbar">
    <div class="back-btn" id="cart-back-btn" onclick="goBackFromCart()">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="topbar-title">Корзина</div>
    <div style="width:36px"></div>
  </div>
  <div id="cart-content"></div>
</div>

<script>
// ════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════

// Замени на ID своей Google Таблицы (из URL после /d/)
const SHEET_ID = '1VrL1prK3HMxk_OjEbqJeglLfOGGGuJqTt_FoLU1qOTM';
// Название листа (вкладки)
const SHEET_NAME = 'Products';

// Курсы валют (базовая — USD)
const RATES = {
  USD: 1,
  UAH: 41.5,   // 1 USD = 41.5 UAH
  PLN: 4.1     // 1 USD = 4.1 PLN
};
const SYMBOLS = { USD: '$', UAH: '₴', PLN: 'zł' };

// Категории и их иконки
const CATEGORIES = [
  { key: 'Одежда',     icon: '👕' },
  { key: 'Кроссовки', icon: '👟' },
  { key: 'Сумки',      icon: '👜' },
  { key: 'Аксессуары', icon: '🧢' },
];

// ════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════
let tg = window.Telegram?.WebApp;
let allProducts = [];
let cart = [];
let currentCurrency = 'USD';
let currentCategory = '';
let currentBrand = '';
let selectedProduct = null;
let selectedSize = '';
let prevScreen = 'screen-welcome';

// ════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  if (tg) {
    tg.ready();
    tg.expand();
  }

  loadCartFromStorage();
  setupCurrencySwitchers();
  renderCategories();
  showScreen('screen-welcome');

  try {
    await fetchProducts();
  } catch(e) {
    console.error(e);
  }

  setTimeout(() => {
    const ls = document.getElementById('loading-screen');
    ls.classList.add('fade-out');
    setTimeout(() => ls.remove(), 400);
  }, 900);
});

// ════════════════════════════════════════════════════
// FETCH FROM GOOGLE SHEETS
// ════════════════════════════════════════════════════
async function fetchProducts() {
  // Публичный CSV экспорт Google Таблицы
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Ошибка загрузки таблицы');
  const text = await res.text();
  allProducts = parseCSV(text);
  renderCategories(); // обновить счётчики
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  // Убираем кавычки из хедеров
  const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
  return lines.slice(1).map(line => {
    const vals = splitCSVLine(line);
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').replace(/^"|"$/g, '').trim());
    return obj;
  }).filter(p => p.id);
}

function splitCSVLine(line) {
  const result = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else cur += c;
  }
  result.push(cur);
  return result;
}

// ════════════════════════════════════════════════════
// CURRENCY
// ════════════════════════════════════════════════════
function setupCurrencySwitchers() {
  document.querySelectorAll('.cur-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCurrency = btn.dataset.cur;
      // Синхронизировать все переключатели
      document.querySelectorAll('.cur-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.cur === currentCurrency);
      });
      // Обновить отображаемые цены если открыт каталог
      if (document.getElementById('screen-catalog').classList.contains('active')) {
        renderCatalog(currentCategory, currentBrand);
      }
      if (document.getElementById('screen-detail').classList.contains('active') && selectedProduct) {
        renderDetail(selectedProduct);
      }
    });
  });
}

function formatPrice(usd) {
  const val = (parseFloat(usd) * RATES[currentCurrency]).toFixed(0);
  const sym = SYMBOLS[currentCurrency];
  return currentCurrency === 'USD' ? `${sym}${val}` : `${val} ${sym}`;
}

// ════════════════════════════════════════════════════
// SCREENS
// ════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active', 'exit-left');
  });
  document.getElementById(id).classList.add('active');
  document.getElementById(id).scrollTop = 0;
}

function goBack(targetScreen) {
  haptic('light');
  showScreen(targetScreen);
}

function goBackFromCart() {
  haptic('light');
  showScreen(prevScreen);
}

// ════════════════════════════════════════════════════
// CATEGORIES
// ════════════════════════════════════════════════════
function renderCategories() {
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = CATEGORIES.map(cat => {
    const count = allProducts.filter(p => p.Category === cat.key).length;
    return `<div class="cat-card" onclick="openCategory('${cat.key}')">
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-name">${cat.key}</div>
      ${count ? `<div class="cat-count">${count} товаров</div>` : '<div class="cat-count">Скоро</div>'}
    </div>`;
  }).join('');
}

function openCategory(cat) {
  haptic('light');
  currentCategory = cat;
  document.getElementById('brands-title').textContent = cat;
  renderBrands(cat);
  showScreen('screen-brands');
}

// ════════════════════════════════════════════════════
// BRANDS
// ════════════════════════════════════════════════════
const BRAND_ICONS = {
  'Nike': '✓', 'Adidas': 'A', 'Chrome Hearts': '✝',
  'New Balance': 'N', 'Jordan': '✈', 'Gucci': 'G',
  'Louis Vuitton': 'LV', 'Supreme': 'S', 'Off-White': 'OW',
};
function getBrandIcon(name) {
  return BRAND_ICONS[name] || name.charAt(0).toUpperCase();
}

function renderBrands(category) {
  const products = allProducts.filter(p => p.Category === category);
  const brandMap = {};
  products.forEach(p => {
    if (!brandMap[p.Brand]) brandMap[p.Brand] = 0;
    brandMap[p.Brand]++;
  });
  const brands = Object.entries(brandMap);
  const list = document.getElementById('brand-list');

  if (!brands.length) {
    list.innerHTML = `<div class="loader-wrap"><div style="color:var(--tg-hint); text-align:center">
      В этой категории пока нет товаров.<br>Загрузи таблицу и заполни данные.
    </div></div>`;
    return;
  }

  list.innerHTML = brands.map(([brand, cnt]) => `
    <div class="brand-row" onclick="openBrand('${brand}')">
      <div class="brand-logo">${getBrandIcon(brand)}</div>
      <div class="brand-name">${brand}</div>
      <div class="brand-cnt">${cnt} шт</div>
      <div class="brand-arrow">›</div>
    </div>
  `).join('');
}

function openBrand(brand) {
  haptic('light');
  currentBrand = brand;
  document.getElementById('catalog-title').textContent = brand;
  renderCatalog(currentCategory, brand);
  showScreen('screen-catalog');
}

// ════════════════════════════════════════════════════
// CATALOG
// ════════════════════════════════════════════════════
function renderCatalog(category, brand) {
  const products = allProducts.filter(p => p.Category === category && p.Brand === brand);
  const grid = document.getElementById('product-grid');

  if (!products.length) {
    grid.innerHTML = `<div style="grid-column:1/-1" class="loader-wrap">
      <div style="color:var(--tg-hint); text-align:center">Нет товаров в этой категории</div>
    </div>`;
    return;
  }

  grid.innerHTML = products.map(p => {
    const imgHtml = p.Image
      ? `<img class="product-img" src="${p.Image}" alt="${p.Title}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=product-img-placeholder>👟</div>'">`
      : `<div class="product-img-placeholder">👟</div>`;
    return `<div class="product-card" onclick="openDetail('${p.id}')">
      ${imgHtml}
      <div class="product-body">
        <div class="product-title">${p.Title}</div>
        <div class="product-price">${formatPrice(p.Price_USD)}</div>
        <div class="product-desc">${(p.Description || '').slice(0, 60)}…</div>
      </div>
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════
// PRODUCT DETAIL
// ════════════════════════════════════════════════════
function openDetail(id) {
  haptic('light');
  selectedProduct = allProducts.find(p => p.id === id);
  selectedSize = '';
  if (!selectedProduct) return;
  renderDetail(selectedProduct);
  showScreen('screen-detail');
}

function renderDetail(p) {
  const sizes = (p.Sizes || '').split(',').map(s => s.trim()).filter(Boolean);
  document.getElementById('detail-topbar-title').textContent = p.Brand;

  const imgHtml = p.Image
    ? `<img class="product-detail-img" src="${p.Image}" alt="${p.Title}" onerror="this.style.display='none'">`
    : `<div style="width:100%;aspect-ratio:4/3;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:4rem;color:rgba(255,255,255,.15)">👟</div>`;

  const sizesHtml = sizes.length ? `
    <div class="sizes-label">Выбери размер</div>
    <div class="sizes-wrap" id="sizes-wrap">
      ${sizes.map(s => `<button class="size-btn ${selectedSize===s?'selected':''}" onclick="selectSize('${s}')">${s}</button>`).join('')}
    </div>
  ` : '';

  document.getElementById('detail-content').innerHTML = `
    ${imgHtml}
    <div class="detail-body">
      <div class="detail-brand">${p.Brand}</div>
      <div class="detail-title">${p.Title}</div>
      <div class="detail-price" id="detail-price">${formatPrice(p.Price_USD)}</div>
      <div class="detail-desc">${p.Description || ''}</div>
      ${sizesHtml}
      <button class="add-cart-btn" id="add-cart-btn" onclick="addToCart()" ${sizes.length && !selectedSize ? 'disabled' : ''}>
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        ${sizes.length && !selectedSize ? 'Выбери размер' : 'Добавить в корзину'}
      </button>
    </div>
  `;
}

function selectSize(size) {
  haptic('light');
  selectedSize = size;
  // Перерисовать кнопки размеров
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.textContent.trim() === size);
  });
  const addBtn = document.getElementById('add-cart-btn');
  if (addBtn) {
    addBtn.disabled = false;
    addBtn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
      <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
    </svg> Добавить в корзину`;
  }
}

// ════════════════════════════════════════════════════
// CART
// ════════════════════════════════════════════════════
function addToCart() {
  if (!selectedProduct) return;
  haptic('success');

  const p = selectedProduct;
  const existing = cart.find(i => i.id === p.id && i.size === selectedSize);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({
      id: p.id, title: p.Title, brand: p.Brand,
      price_usd: parseFloat(p.Price_USD),
      size: selectedSize, qty: 1,
      image: p.Image
    });
  }
  saveCartToStorage();
  updateCartBadges();
  showToast('Добавлено в корзину ✓');
}

function showCart() {
  haptic('light');
  // Запомним, с какого экрана пришли
  const screens = ['screen-welcome','screen-brands','screen-catalog','screen-detail'];
  for (const s of screens) {
    if (document.getElementById(s).classList.contains('active')) {
      prevScreen = s; break;
    }
  }
  renderCart();
  showScreen('screen-cart');
}

function renderCart() {
  const container = document.getElementById('cart-content');
  if (!cart.length) {
    container.innerHTML = `<div class="empty-cart">
      <div class="empty-icon">🛒</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:1.5rem;">Корзина пуста</div>
      <div style="font-size:.85rem;color:var(--tg-hint)">Добавь товары из каталога</div>
    </div>`;
    return;
  }

  const total = cart.reduce((s, i) => s + i.price_usd * i.qty, 0);
  const itemsHtml = cart.map((item, idx) => {
    const imgHtml = item.image
      ? `<img class="cart-item-img" src="${item.image}" alt="${item.title}" onerror="this.src=''">`
      : `<div class="cart-item-img" style="background:#222;display:flex;align-items:center;justify-content:center;font-size:1.8rem">👟</div>`;
    return `<div class="cart-item" id="cart-item-${idx}">
      ${imgHtml}
      <div class="cart-item-info">
        <div class="cart-item-title">${item.brand} — ${item.title}</div>
        ${item.size ? `<div class="cart-item-size">Размер: ${item.size}</div>` : ''}
        <div class="cart-item-price">${formatPrice(item.price_usd)}</div>
        <div class="qty-controls">
          <div class="qty-btn" onclick="changeQty(${idx},-1)">−</div>
          <div class="qty-num">${item.qty}</div>
          <div class="qty-btn" onclick="changeQty(${idx},1)">+</div>
          <div style="flex:1"></div>
          <div class="delete-btn" onclick="removeFromCart(${idx})">✕</div>
        </div>
      </div>
    </div>`;
  }).join('');

  container.innerHTML = `
    <div class="cart-items">${itemsHtml}</div>
    <div class="cart-total-box">
      <div class="cart-total-row">
        <div class="cart-total-label">Итого (${cart.reduce((s,i)=>s+i.qty,0)} поз.)</div>
        <div class="cart-total-val">${formatPrice(total)}</div>
      </div>
    </div>
    <button class="checkout-btn" onclick="checkout()">Оформить заказ →</button>
  `;
}

function changeQty(idx, delta) {
  haptic('light');
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  saveCartToStorage();
  updateCartBadges();
  renderCart();
}

function removeFromCart(idx) {
  haptic('light');
  cart.splice(idx, 1);
  saveCartToStorage();
  updateCartBadges();
  renderCart();
}

function updateCartBadges() {
  const total = cart.reduce((s, i) => s + i.qty, 0);
  document.querySelectorAll('.cart-badge').forEach(b => {
    b.textContent = total;
    b.style.display = total ? 'flex' : 'none';
  });
}

function saveCartToStorage() {
  try { localStorage.setItem('drip_cart', JSON.stringify(cart)); } catch(e) {}
}

function loadCartFromStorage() {
  try {
    const d = localStorage.getItem('drip_cart');
    if (d) cart = JSON.parse(d);
    updateCartBadges();
  } catch(e) {}
}

// ════════════════════════════════════════════════════
// CHECKOUT — отправка данных боту
// ════════════════════════════════════════════════════
function checkout() {
  if (!cart.length) return;
  haptic('success');

  const total = cart.reduce((s, i) => s + i.price_usd * i.qty, 0);
  const totalConverted = (total * RATES[currentCurrency]).toFixed(0);
  const sym = SYMBOLS[currentCurrency];

  const orderData = {
    items: cart.map(i => ({
      title: i.title,
      brand: i.brand,
      size: i.size,
      qty: i.qty,
      price_usd: i.price_usd
    })),
    currency: currentCurrency,
    total_usd: total.toFixed(2),
    total_display: `${totalConverted} ${sym}`
  };

  if (tg && tg.sendData) {
    tg.sendData(JSON.stringify(orderData));
  } else {
    // Для тестирования без Telegram
    alert('Заказ:\n' + JSON.stringify(orderData, null, 2));
  }
}

// ════════════════════════════════════════════════════
// HAPTIC FEEDBACK
// ════════════════════════════════════════════════════
function haptic(type = 'light') {
  try {
    if (tg?.HapticFeedback) {
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      else tg.HapticFeedback.impactOccurred(type);
    }
  } catch(e) {}
}

// ════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
